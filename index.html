<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OpenHabits</title>
    <meta name="description" content="A daily quote and a habit tracker that works offline. Your data stays on your device." />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpenHabits" />

    <!--
      Pre-paint theme. This runs before the first frame and before React, so a
      dark-theme user never sees a white flash on load. localStorage is only a
      paint hint here; IndexedDB remains the source of truth and Settings writes
      to both.
    -->
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('oh.theme') || 'system'
          var dark =
            choice === 'dark' ||
            (choice === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* Private mode can throw on localStorage; light is a fine default. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
