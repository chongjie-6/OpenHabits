# Every check the project has, on every push and pull request.
#
# The build step is not ceremony: `npm run build` runs the prerender pass, which
# is where the service-worker shell is checked against the router. A route added
# or removed without updating public/sw.js fails here rather than silently
# breaking offline for everyone.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc -b

      - name: Tests
        run: npm test

      - name: Build and prerender
        run: npm run build

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Offline end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
